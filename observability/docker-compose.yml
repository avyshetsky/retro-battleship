# Local observability + high-availability demo stack for the Battleship API.
#
#   docker compose up --build
#
# This brings up:
#   * two replicas of the API (api1, api2) behind an nginx load balancer
#   * an OpenTelemetry Collector that fans traces out to Jaeger and metrics to
#     Prometheus
#   * Jaeger (traces UI), Prometheus (metrics), and Grafana (dashboards)
#
# Endpoints once running:
#   API (load-balanced) ... http://localhost:8080
#   Jaeger UI ............. http://localhost:16686
#   Prometheus ........... http://localhost:9090
#   Grafana .............. http://localhost:3000  (admin / admin)

services:
  api1:
    build: ../backend
    environment:
      OTEL_SERVICE_NAME: battleship-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      APP_VERSION: "0.1.0"
      HOSTNAME: api1
    depends_on:
      - otel-collector

  api2:
    build: ../backend
    environment:
      OTEL_SERVICE_NAME: battleship-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      APP_VERSION: "0.1.0"
      HOSTNAME: api2
    depends_on:
      - otel-collector

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter scrape target

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
