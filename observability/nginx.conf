events {}

http {
  # Round-robin load balancer across the two API replicas. This is what makes
  # the demo "highly available": if one replica dies, nginx routes around it.
  upstream battleship_api {
    server api1:8000 max_fails=1 fail_timeout=5s;
    server api2:8000 max_fails=1 fail_timeout=5s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://battleship_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
